# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]
# "mold" names the linker (https://github.com/rui314/mold); it is not a
# misspelling of "mould" in that context.
mold = "mold"

[patterns]
# Preserve complete formal names while allowing Markdown line wrapping.
ignore = [
  "Azure Architecture\\s+Center\\s+\\|\\s+Microsoft Learn",
  "GitHub\\s+Flavored\\s+Markdown",
]

[files]
exclude = []
