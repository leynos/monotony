# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
# Preserve complete formal names while allowing Markdown line wrapping.
ignore = [
  "Azure Architecture\\s+Center\\s+\\|\\s+Microsoft Learn",
  "GitHub\\s+Flavored\\s+Markdown",
  # Inline-code citations of US-spelled identifiers: the `mold` linker and the
  # `color` API named as an example in the documentation style guide.
  "`color`",
  "`mold`",
  # The mold linker flag the build standard section spells out.
  "-fuse-ld=mold",
  # The setup-rust input the build standard section names.
  "`install-mold`",
]

[files]
exclude = []
